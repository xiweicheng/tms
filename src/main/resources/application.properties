spring.profiles.active=dev
spring.profiles.include=tms

spring.datasource.url=jdbc:mysql://localhost:3306/tms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=tms
spring.datasource.password=pwd123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.sql-script-encoding=UTF-8

spring.datasource.hikari.max-wait=60000
spring.datasource.hikari.maximum-pool-size=150
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-test-query=select 1 from dual
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.initialization-fail-timeout=1
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#logging.level.com.lhjz.portal=DEBUG
#logging.level.org.springframework.security=DEBUG
logging.file.name=log/tms/tms.log

spring.messages.basename=messages,views
spring.messages.encoding=ISO-8859-1

spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

server.port=80
server.servlet.context-path=/
#server.servlet.session.timeout=600s

management.endpoints.web.base-path=/manage

spring.freemarker.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.enabled-by-default=false

# spring mail
spring.mail.host=smtp.163.com
spring.mail.port=25
spring.mail.username=someone@163.com
spring.mail.password=someone
spring.mail.default-encoding=UTF-8

#custom
security.oauth2.client.client-id=tms
security.oauth2.client.client-secret=tms
security.oauth2.client.scope=read,write
security.oauth2.client.auto-approve-scopes=.*

#jackson
spring.jackson.default-property-inclusion=non-null
